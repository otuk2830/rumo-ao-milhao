<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rumo ao Milhão">
<meta name="robots" content="noindex">
<title>Rumo ao Milhão</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=4.52">
<script>/* theme before paint (not sensitive, kept outside the encrypted data) */
(function(){var t='auto';try{t=localStorage.getItem('rumo.theme')||'auto'}catch(e){}
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);try{if(localStorage.getItem('rumo.hide')==='1')document.documentElement.classList.add('priv')}catch(e){}})();</script>
</head>
<body>
<!-- Lock / setup screen -->
<section id="lock" class="lock hidden">
  <div class="lock-inner">
    <div class="logo">R$</div>
    <h1>Rumo ao Milhão</h1>
    <p id="lock-msg">Digite seu PIN</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <button class="btn primary wide hidden" id="face-btn" style="margin:0 0 18px">🙂 Desbloquear com Face ID</button>
    <div class="pad" id="pad"></div>
    <p class="lock-foot" id="lock-foot"></p>
  </div>
</section>

<!-- First-run choice -->
<section id="welcome" class="lock hidden">
  <div class="lock-inner">
    <div class="logo">R$</div>
    <h1>Tudo pronto</h1>
    <p>Seus dados ficam só neste aparelho, protegidos pelo PIN.</p>
    <button class="btn primary wide" id="w-import">Importar backup</button>
    <button class="btn ghost wide" id="w-empty">Começar do zero</button>
  </div>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div>
      <div class="top-title" id="top-title">Painel</div>
      <div class="top-sub" id="top-sub"></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-refresh" aria-label="Atualizar preços"><svg class="ic-spin" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="btn-eye" aria-label="Esconder valores"></button>
      <button class="icon-btn" id="btn-lock" aria-label="Bloquear"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="btn-settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <a href="#painel" data-tab="painel"><span>◉</span>Painel</a>
    <a href="#atualizar" data-tab="atualizar"><span>✎</span>Atualizar</a>
    <a href="#historico" data-tab="historico"><span>☰</span>Histórico</a>
    <a href="#dividendos" data-tab="dividendos"><span>❖</span>Dividendos</a>
    <a href="#ativos" data-tab="ativos"><span>◆</span>Ativos</a>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="file-in" accept=".json,application/json" class="hidden">

<script src="app.js?v=4.52"></script>
</body>
</html>
