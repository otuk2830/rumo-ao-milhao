<style>/* paint the app colour at once, so there is no white flash before the stylesheet loads */html,body{background:#0A0A0B;margin:0}html:not(.dark),html:not(.dark) body{background:#EFECE6}</style>
<link rel="stylesheet" href="app.css?v=10.0">
<script>/* theme before paint (not sensitive, kept outside the encrypted data) */
(function(){var t='auto';try{t=localStorage.getItem('rumo.theme')||'auto'}catch(e){}
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);try{var mt=document.getElementById('m-theme');if(mt)mt.setAttribute('content',d?'#0A0A0B':'#EFECE6');if(!d){var sb=document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');if(sb)sb.setAttribute('content','default')}}catch(e){}try{if(localStorage.getItem('rumo.hide')==='1')document.documentElement.classList.add('priv')}catch(e){}})();</script>

<body>
<!-- Lock / setup screen -->
<section id="lock" class="lock hidden">
  <div class="lock-inner">
    <div class="logo lkring"><svg viewBox="0 0 100 100" width="76" height="76" aria-hidden="true"><defs><linearGradient id="lkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEE4"/><stop offset="1" stop-color="#B89A6C"/></linearGradient></defs><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/><circle class="lkarc" cx="50" cy="50" r="40" fill="none" stroke="url(#lkg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="188 252" transform="rotate(-90 50 50)"/><text x="50" y="58" text-anchor="middle" fill="#F3EEE4" font-size="24" font-weight="300">R$</text></svg></div>
    <p class="lock-hi" id="lock-hi"></p>
    <h1>Rumo ao Milhão</h1>
    <p id="lock-msg">Digite seu PIN</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <button class="btn primary wide hidden" id="face-btn" style="margin:0 0 18px">🙂 Desbloquear com Face ID</button>
    <div class="pad" id="pad"></div>
    <p class="lock-foot" id="lock-foot"></p>
  </div>
</section>

<!-- First-run choice -->
<section id="welcome" class="lock hidden">
  <div class="lock-inner">
    <div class="logo">R$</div>
    <h1>Tudo pronto</h1>
    <p>Seus dados ficam só neste aparelho, protegidos pelo PIN.</p>
    <button class="btn primary wide" id="w-import">Importar backup</button>
    <button class="btn ghost wide" id="w-empty">Começar do zero</button>
    <button class="btn primary wide hidden" id="w-demo" style="margin-top:10px">Ver com dados de exemplo</button>
  </div>
</section>

    </div>
